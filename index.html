<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="reactor-mini">
          <div class="core-mini"></div>
        </div>
        <div class="brand-info">
          <h1>JARVIS</h1>
          <span class="brand-sub">Personal Assistant</span>
        </div>
      </div>

      <div class="header-right">
        <div class="status-badge">
          <span class="status-dot"></span>
          <span id="status-text">Online</span>
        </div>
        <button id="settings-toggle-btn" class="icon-button" title="Voice Settings" aria-label="Toggle voice settings">
          ⚙️
        </button>
      </div>
    </header>

    <!-- Central AI Orb Visualizer -->
    <section class="orb-section" aria-label="JARVIS Core Status">
      <div class="arc-reactor state-idle" id="arc-reactor">
        <div class="ring outer-ring"></div>
        <div class="ring segmented-ring"></div>
        <div class="ring middle-ring"></div>
        <div class="ring inner-ring"></div>
        <div class="reactor-core">
          <div class="core-glow"></div>
          <div class="waveform-bars" id="waveform">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>
      <div class="orb-state-label" id="orb-state-label">Ready</div>
    </section>

    <!-- Voice Settings Drawer (Collapsible) -->
    <section class="settings-drawer collapsed" id="settings-drawer" aria-label="Voice settings">
      <div class="drawer-header">
        <span>Voice Configuration</span>
        <button id="close-settings-btn" class="close-btn">✕</button>
      </div>
      <div class="drawer-grid">
        <div class="setting-item">
          <label for="voice-select">Voice:</label>
          <select id="voice-select" aria-label="Select speech voice"></select>
        </div>
        <div class="setting-item">
          <label for="pitch-slider">Pitch (<span id="pitch-val">1.0</span>):</label>
          <input type="range" id="pitch-slider" min="0.5" max="1.5" step="0.05" value="1.0" />
        </div>
        <div class="setting-item">
          <label for="rate-slider">Speed (<span id="rate-val">1.0</span>):</label>
          <input type="range" id="rate-slider" min="0.7" max="1.4" step="0.05" value="1.0" />
        </div>
        <div class="setting-item">
          <label for="volume-slider">Volume (<span id="volume-val">100%</span>):</label>
          <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1.0" />
        </div>
      </div>
    </section>

    <!-- Conversation Stream Panel -->
    <main class="chat-container">
      <div class="chat-header">
        <span class="chat-title">Conversation</span>
        <button id="clear-chat-btn" class="clear-btn" title="Clear Conversation">Clear</button>
      </div>
      <div id="chat-box" class="chat-box" aria-live="polite">
        <!-- Messages render here -->
      </div>
    </main>

    <!-- Clean Input Console -->
    <footer class="input-console">
      <div class="input-row">
        <input 
          type="text" 
          id="input-text" 
          placeholder="Speak or type a command..." 
          autocomplete="off" 
          aria-label="Input command or message"
        />
        <button id="send-btn" class="btn send-btn" aria-label="Send message">
          Send
        </button>
        <button id="voice-btn" class="btn voice-btn" title="Voice Input" aria-label="Voice input microphone">
          <span class="mic-icon">🎙️</span>
          <span class="voice-btn-label">Voice</span>
        </button>
      </div>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
